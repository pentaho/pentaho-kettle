# Squid HTTP Proxy with Basic Authentication
# Port configuration
http_port 3128

# Authentication configuration
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic children 5
auth_param basic realm PDI SSH Proxy Authentication
auth_param basic credentialsttl 2 hours

# Access control lists
acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 22
acl Safe_ports port 2222-2224
acl CONNECT method CONNECT

# Allow authenticated users to use CONNECT method (for SSH tunneling)
http_access allow authenticated CONNECT Safe_ports
http_access allow authenticated Safe_ports

# Deny all other access
http_access deny all

# Logging
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Disable caching (not needed for SSH tunneling)
cache deny all

# Allow larger requests for SSH traffic
request_body_max_size 0

# DNS configuration
dns_nameservers 127.0.0.11
